name: CI
on:
  push:
  pull_request:

jobs:
  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libx11-dev libxdo-dev libdbus-1-dev libfontconfig1-dev cmake pkg-config
      - name: Test
        working-directory: engine
        run: cargo test --release --workspace --locked
      - name: Extension script syntax
        run: node --check gnome-extension/voicio@derpx06.github.io/extension.js

  # Windows and macOS are experimental: CI proves they compile, nothing more.
  desktop-cross:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - name: Check
        working-directory: engine
        run: cargo check --release -p voicio --locked

  android-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (pure Kotlin)
        run: ./gradlew :core:test --no-daemon --max-workers=2

  chrome-extension:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: extension }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: extension/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
