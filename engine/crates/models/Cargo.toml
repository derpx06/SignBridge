[package]
name = "voicio-models"
version = "0.9.0"
edition = "2021"
license.workspace = true
description = "Voicio model catalog, tiers, and the one place that downloads and verifies model files"
publish = false

[dependencies]
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
bzip2 = "0.6"
sysinfo = { version = "0.38", default-features = false, features = ["disk", "system"] }

[dev-dependencies]
tempfile = "3"

# TLS: rustls on Linux (no system library needed); the operating system's own TLS on Windows and
# macOS (uses the system certificate store, and needs no C compiler to build).
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3", features = ["rustls"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
